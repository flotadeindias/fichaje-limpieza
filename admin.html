<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Control | Flota de Indias</title>
  <style>
    :root {
      --bg-dark: #0b1120;
      --card-bg: #131c31;
      --accent-gold: #e2c388;
      --text-light: #ffffff;
      --text-muted: #94a3b8;
      --border-color: #2a3853;
      --table-header: #1e293b;
      --btn-red: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-light);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    /* CABECERA CORPORATIVA */
    header {
      width: 100%;
      max-width: 900px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px 10px 25px 10px;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 25px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .logo-container img {
      height: 60px;
      width: auto;
      object-fit: contain;
      display: block;
    }

    .brand-title h1 {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-light);
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .brand-title p {
      font-size: 13px;
      color: var(--accent-gold);
      margin-top: 2px;
      font-weight: 500;
    }

    .btn-logout {
      display: none;
      background-color: transparent;
      border: 1px solid var(--btn-red);
      color: var(--btn-red);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-logout:hover {
      background-color: var(--btn-red);
      color: #ffffff;
    }

    /* SECCIÓN DE LOGIN CON PIN */
    #login-screen {
      background: var(--card-bg);
      width: 100%;
      max-width: 400px;
      border-radius: 18px;
      padding: 30px 20px;
      border: 1px solid var(--border-color);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      text-align: center;
      margin-top: 40px;
    }

    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input, select {
      width: 100%;
      padding: 14px;
      background-color: #0f172a;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      color: var(--text-light);
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus {
      border-color: var(--accent-gold);
    }

    .btn-primary {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background-color: var(--accent-gold);
      color: #000;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn-primary:hover {
      opacity: 0.9;
    }

    /* PANEL PRINCIPAL */
    #admin-panel {
      display: none;
      width: 100%;
      max-width: 900px;
    }

    .controls-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
      margin-bottom: 25px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 20px;
      border: 1px solid var(--border-color);
    }

    .card-title {
      font-size: 13px;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 10px;
      letter-spacing: 0.5px;
    }

    .highlight-val {
      font-size: 22px;
      font-weight: 700;
      color: var(--accent-gold);
    }

    /* TABLA DE FICHAJES */
    .table-container {
      background: var(--card-bg);
      border-radius: 14px;
      border: 1px solid var(--border-color);
      overflow-x: auto;
      margin-top: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 14px;
    }

    th {
      background-color: var(--table-header);
      color: var(--accent-gold);
      padding: 14px;
      font-weight: 600;
      text-transform: uppercase;
      font-size: 12px;
      border-bottom: 1px solid var(--border-color);
    }

    td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border-color);
      color: var(--text-light);
    }

    tr:last-child td {
      border-bottom: none;
    }

    #error-msg {
      color: #ef4444;
      font-size: 13px;
      margin-top: 10px;
      display: none;
    }

    footer {
      margin-top: auto;
      padding-top: 40px;
      font-size: 11px;
      color: var(--text-muted);
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- CABECERA CORPORATIVA -->
  <header>
    <div class="header-left">
      <div class="logo-container">
        <img src="logo.jpg" alt="Logo Flota de Indias" onerror="this.style.display='none'">
      </div>
      <div class="brand-title">
        <h1>Flota de Indias</h1>
        <p>Panel Privado de Administración</p>
      </div>
    </div>
    <button id="btn-logout" class="btn-logout" onclick="cerrarSesion()">Cerrar Sesión</button>
  </header>

  <!-- PANTALLA DE ACCESO CON PIN -->
  <div id="login-screen">
    <div class="form-group">
      <label for="pin">Clave de Acceso</label>
      <input type="password" id="pin" placeholder="Ingresa tu clave de administración" autofocus>
    </div>
    <button class="btn-primary" onclick="validarPin()">Entrar al Panel</button>
    <div id="error-msg">Clave incorrecta. Inténtalo de nuevo.</div>
  </div>

  <!-- PANEL DE ADMINISTRACIÓN -->
  <div id="admin-panel">
    <div class="controls-grid">
      <div class="card">
        <div class="card-title">Filtrar por Trabajadora</div>
        <select id="filtro-empleado" onchange="calcularTotales()">
          <option value="TODAS">-- Todas las Trabajadoras --</option>
          <option value="Limpiadora 1">Limpiadora 1</option>
          <option value="Limpiadora 2">Limpiadora 2</option>
          <option value="Limpiadora 3">Limpiadora 3</option>
        </select>
      </div>

      <div class="card">
        <div class="card-title">Horas Trabajadas Est.</div>
        <div class="highlight-val" id="total-horas">0.0 hrs</div>
      </div>

      <div class="card">
        <div class="card-title">Sueldo Estimado (25€ / 3h)</div>
        <div class="highlight-val" id="total-sueldo">0.00 €</div>
      </div>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Fecha y Hora</th>
            <th>Trabajadora</th>
            <th>Apartamento</th>
            <th>Acción</th>
            <th>Ubicación</th>
          </tr>
        </thead>
        <tbody id="tabla-fichajes">
          <!-- Datos cargados dinámicamente -->
        </tbody>
      </table>
    </div>
  </div>

  <footer>
    &copy; Flota de Indias - Gestión de Personal
  </footer>

<script>
  // NUEVO PIN CONFIGURADO
  const PIN_CORRECTO = "Flotaindias.16";

  // Al cargar la página, comprobar si ya inició sesión anteriormente
  window.onload = function() {
    if (localStorage.getItem("admin_authenticated") === "true") {
      mostrarPanel();
    }
  };

  function validarPin() {
    const inputPin = document.getElementById("pin").value;
    const errorMsg = document.getElementById("error-msg");

    if (inputPin === PIN_CORRECTO) {
      // Guardar la sesión en el navegador
      localStorage.setItem("admin_authenticated", "true");
      mostrarPanel();
    } else {
      errorMsg.style.display = "block";
    }
  }

  function mostrarPanel() {
    document.getElementById("login-screen").style.display = "none";
    document.getElementById("admin-panel").style.display = "block";
    document.getElementById("btn-logout").style.display = "block";
    cargarDatosSimulados();
  }

  function cerrarSesion() {
    localStorage.removeItem("admin_authenticated");
    location.reload();
  }

  const registrosSimulados = [
    { fecha: "18/08/2026 09:00", empleado: "Limpiadora 1", apartamento: "Apartamento 1", accion: "Entrada", lat: "37.3891", lng: "-5.9845" },
    { fecha: "18/08/2026 12:00", empleado: "Limpiadora 1", apartamento: "Apartamento 1", accion: "Salida", lat: "37.3891", lng: "-5.9845" }
  ];

  function cargarDatosSimulados() {
    const tbody = document.getElementById("tabla-fichajes");
    tbody.innerHTML = "";

    registrosSimulados.forEach(reg => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${reg.fecha}</td>
        <td>${reg.empleado}</td>
        <td>${reg.apartamento}</td>
        <td><strong>${reg.accion}</strong></td>
        <td><a href="https://maps.google.com/?q=${reg.lat},${reg.lng}" target="_blank" style="color: #e2c388; text-decoration: none;">Ver Mapa 📍</a></td>
      `;
      tbody.appendChild(tr);
    });

    calcularTotales();
  }

  function calcularTotales() {
    const TASA_HORA = 25 / 3; 
    const horasEstimadas = 3.0; 
    const sueldoEstimado = horasEstimadas * TASA_HORA;

    document.getElementById("total-horas").innerText = horasEstimadas.toFixed(1) + " hrs";
    document.getElementById("total-sueldo").innerText = sueldoEstimado.toFixed(2) + " €";
  }
</script>

</body>
</html>
