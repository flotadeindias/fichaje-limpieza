<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fichaje de Limpieza | Flota de Indias</title>
  <style>
    :root {
      --bg-dark: #0b1120;
      --card-bg: #131c31;
      --accent-gold: #e2c388;
      --text-light: #ffffff;
      --text-muted: #94a3b8;
      --border-color: #2a3853;
      --btn-green: #10b981;
      --btn-red: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-light);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 15px;
    }

    /* CABECERA CORPORATIVA CON LOGO ARRIBA A LA IZQUIERDA */
    header {
      width: 100%;
      max-width: 450px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 15px;
      padding: 15px 10px 25px 10px;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 25px;
    }

    .logo-container img {
      height: 55px;
      width: auto;
      object-fit: contain;
      display: block;
    }

    .brand-title h1 {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-light);
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .brand-title p {
      font-size: 12px;
      color: var(--accent-gold);
      margin-top: 2px;
      font-weight: 500;
    }

    /* TARJETA DE FICHAJE */
    .card {
      background: var(--card-bg);
      width: 100%;
      max-width: 450px;
      border-radius: 18px;
      padding: 25px 20px;
      border: 1px solid var(--border-color);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    select {
      width: 100%;
      padding: 14px;
      background-color: #0f172a;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      color: var(--text-light);
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }

    select:focus {
      border-color: var(--accent-gold);
    }

    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-top: 10px;
    }

    button {
      padding: 16px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      color: #ffffff;
      transition: transform 0.1s, opacity 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    button:active {
      transform: scale(0.98);
    }

    .btn-entrada {
      background-color: var(--btn-green);
    }

    .btn-salida {
      background-color: var(--btn-red);
    }

    /* ESTADOS Y MENSAJES */
    #status {
      margin-top: 20px;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      text-align: center;
      display: none;
      font-weight: 600;
    }

    .status-success {
      background-color: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .status-error {
      background-color: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .status-loading {
      background-color: rgba(226, 195, 136, 0.15);
      color: var(--accent-gold);
      border: 1px solid rgba(226, 195, 136, 0.3);
    }

    footer {
      margin-top: auto;
      padding-top: 30px;
      font-size: 11px;
      color: var(--text-muted);
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- CABECERA CON LOGO Y TÍTULO CORPORATIVO -->
  <header>
    <div class="logo-container">
      <img src="logo.jpg" alt="Logo Flota de Indias" onerror="this.style.display='none'">
    </div>
    <div class="brand-title">
      <h1>Flota de Indias</h1>
      <p>Control de Fichaje | Personal</p>
    </div>
  </header>

  <!-- FORMULARIO DE FICHAJE PARA LIMPIADORAS -->
  <div class="card">
    <div class="form-group">
      <label for="empleado">Selecciona tu Nombre</label>
      <select id="empleado">
        <option value="">-- Seleccionar --</option>
        <option value="Limpiadora 1">Limpiadora 1</option>
        <option value="Limpiadora 2">Limpiadora 2</option>
        <option value="Limpiadora 3">Limpiadora 3</option>
      </select>
    </div>

    <div class="form-group">
      <label for="apartamento">Apartamento</label>
      <select id="apartamento">
        <option value="">-- Seleccionar Apartamento --</option>
        <option value="Apartamento 1">Apartamento 1</option>
        <option value="Apartamento 2">Apartamento 2</option>
        <option value="Apartamento 3">Apartamento 3</option>
      </select>
    </div>

    <div class="btn-grid">
      <button class="btn-entrada" onclick="fichar('Entrada')">
        ▶ Entrada
      </button>
      <button class="btn-salida" onclick="fichar('Salida')">
        ⏹ Salida
      </button>
    </div>

    <div id="status"></div>
  </div>

  <footer>
    &copy; Flota de Indias - Sistema de Gestión de Fichajes
  </footer>

<script>
  // URL de tu servidor Google Apps Script
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz5GTyMHzJEabRfJt2hRKBADrE4JWzxiWcnNI92wAe1gZLnm-lBaq9-S0-r4fAiEVJazw/exec";

  function mostrarEstado(mensaje, tipo) {
    const statusDiv = document.getElementById("status");
    statusDiv.className = "";
    statusDiv.classList.add("status-" + tipo);
    statusDiv.innerText = mensaje;
    statusDiv.style.display = "block";
  }

  function fichar(accion) {
    const empleado = document.getElementById("empleado").value;
    const apartamento = document.getElementById("apartamento").value;

    if (!empleado || !apartamento) {
      mostrarEstado("Por favor, selecciona tu nombre y el apartamento.", "error");
      return;
    }

    mostrarEstado("Obteniendo ubicación GPS...", "loading");

    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        (position) => {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;
          enviarDatos(empleado, apartamento, accion, lat, lng);
        },
        (error) => {
          mostrarEstado("Error al obtener la ubicación GPS. Activa la ubicación en tu móvil.", "error");
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    } else {
      mostrarEstado("Tu navegador no soporta geolocalización.", "error");
    }
  }

  function enviarDatos(empleado, apartamento, accion, lat, lng) {
    mostrarEstado("Registrando fichaje...", "loading");

    const payload = {
      empleado: empleado,
      apartamento: apartamento,
      accion: accion,
      lat: lat,
      lng: lng
    };

    fetch(WEB_APP_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    })
    .then(() => {
      mostrarEstado(`¡${accion} registrada correctamente!`, "success");
    })
    .catch((err) => {
      mostrarEstado("Error al enviar el fichaje. Inténtalo de nuevo.", "error");
    });
  }
</script>

</body>
</html>
