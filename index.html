<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fichaje de Limpieza | Flota de Indias</title>
  <style>
    :root {
      --bg-dark: #0b1120;
      --card-bg: #131c31;
      --accent-gold: #e2c388;
      --text-light: #ffffff;
      --text-muted: #94a3b8;
      --border-color: #2a3853;
      --btn-green: #10b981;
      --btn-red: #ef4444;
      --btn-disabled: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-light);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 15px;
    }

    header {
      width: 100%;
      max-width: 450px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 15px;
      padding: 15px 10px 25px 10px;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 25px;
    }

    .logo-container img {
      height: 55px;
      width: auto;
      object-fit: contain;
      display: block;
      background: transparent;
    }

    .brand-title h1 {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-light);
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .brand-title p {
      font-size: 12px;
      color: var(--accent-gold);
      margin-top: 2px;
      font-weight: 500;
    }

    .card {
      background: var(--card-bg);
      width: 100%;
      max-width: 450px;
      border-radius: 18px;
      padding: 25px 20px;
      border: 1px solid var(--border-color);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    select {
      width: 100%;
      padding: 14px;
      background-color: #0f172a;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      color: var(--text-light);
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }

    select:focus {
      border-color: var(--accent-gold);
    }

    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-top: 15px;
    }

    button {
      padding: 16px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      color: #ffffff;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    button:active {
      transform: scale(0.98);
    }

    .btn-entrada {
      background-color: var(--btn-green);
    }

    .btn-salida {
      background-color: var(--btn-red);
    }

    button:disabled {
      background-color: var(--btn-disabled) !important;
      color: #64748b !important;
      cursor: not-allowed;
      opacity: 0.6;
    }

    .active-session {
      background: rgba(226, 195, 136, 0.1);
      border: 1px solid var(--accent-gold);
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 20px;
      font-size: 13px;
      color: var(--accent-gold);
      text-align: center;
      display: none;
    }

    #status {
      margin-top: 20px;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      text-align: center;
      display: none;
      font-weight: 600;
    }

    .status-success {
      background-color: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .status-error {
      background-color: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .status-loading {
      background-color: rgba(226, 195, 136, 0.15);
      color: var(--accent-gold);
      border: 1px solid rgba(226, 195, 136, 0.3);
    }

    footer {
      margin-top: auto;
      padding-top: 30px;
      font-size: 11px;
      color: var(--text-muted);
      text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-container">
      <img src="logo.jpg" alt="Logo Flota de Indias" onerror="this.style.display='none'">
    </div>
    <div class="brand-title">
      <h1>Flota de Indias</h1>
      <p>Control de Fichaje | Personal</p>
    </div>
  </header>

  <div class="card">
    <div id="active-session-banner" class="active-session">
      ⏳ Tienes un turno de trabajo en curso.
    </div>

    <div class="form-group">
      <label for="empleado">Selecciona tu Nombre</label>
      <select id="empleado">
        <option value="">-- Seleccionar --</option>
        <option value="Sara">Sara</option>
        <option value="Manuela">Manuela</option>
        <option value="Marcela">Marcela</option>
      </select>
    </div>

    <div class="form-group">
      <label for="apartamento">Apartamento</label>
      <select id="apartamento">
        <option value="">-- Seleccionar Apartamento --</option>
        <option value="Azofaifo" data-lat="37.392181723816016" data-lng="-5.994280751381017">Azofaifo</option>
        <option value="Calatrava" data-lat="37.40183308507924" data-lng="-5.994294847901409">Calatrava</option>
        <option value="Casa Joaquín Costa" data-lat="37.39775742953177" data-lng="-5.99299991906575">Casa Joaquín Costa</option>
        <option value="Doña Elvira" data-lat="37.38476309556541" data-lng="-5.990518490230577">Doña Elvira</option>
        <option value="Fernández y González" data-lat="37.38723019191801" data-lng="-5.994772990230378">Fernández y González</option>
        <option value="Joaquín Costa 1" data-lat="37.39777505291778" data-lng="-5.993273347901573">Joaquín Costa 1</option>
        <option value="Joaquín Costa Ático" data-lat="37.39777505291778" data-lng="-5.993273347901573">Joaquín Costa Ático</option>
        <option value="Las Setas" data-lat="37.3938228859466" data-lng="-5.990720493001506">Las Setas</option>
        <option value="Lecha Marzo" data-lat="37.391566457858886" data-lng="-5.983901988379235">Lecha Marzo</option>
        <option value="Murillo" data-lat="37.39093374948271" data-lng="-5.997862396975923">Murillo</option>
        <option value="Placentines" data-lat="37.38716386586947" data-lng="-5.992253103722846">Placentines</option>
        <option value="Santa Cruz 1" data-lat="37.38552344327576" data-lng="-5.988267261394636">Santa Cruz 1</option>
        <option value="Santa Cruz 2" data-lat="37.38552344327576" data-lng="-5.988267261394636">Santa Cruz 2</option>
        <option value="Santa Cruz Ático" data-lat="37.38552344327576" data-lng="-5.988267261394636">Santa Cruz Ático</option>
        <option value="Santas Patronas" data-lat="37.38803824440809" data-lng="-5.998336494339201">Santas Patronas</option>
        <option value="Trajano" data-lat="37.39685119527932" data-lng="-5.994450276737502">Trajano</option>
      </select>
    </div>

    <div class="btn-grid">
      <button id="btn-entrada" class="btn-entrada" onclick="fichar('Entrada')">
        ▶ Entrada
      </button>
      <button id="btn-salida" class="btn-salida" onclick="fichar('Salida')" disabled>
        ⏹ Salida
      </button>
    </div>

    <div id="status"></div>
  </div>

  <footer>
    &copy; Flota de Indias - Sistema de Gestión de Fichajes
  </footer>

<script>
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwUt1ELaMkTUyFXROZG8N2qrN1VHgzfRLNNwtp_-hf3udp4f0KDulxTCnQ83i3KXURNGQ/exec";

  window.onload = function() {
    comprobarEstadoSesion();
  };

  function comprobarEstadoSesion() {
    const sesionActiva = localStorage.getItem("fichaje_activo");
    const btnEntrada = document.getElementById("btn-entrada");
    const btnSalida = document.getElementById("btn-salida");
    const banner = document.getElementById("active-session-banner");

    if (sesionActiva) {
      const datos = JSON.parse(sesionActiva);
      document.getElementById("empleado").value = datos.empleado;
      document.getElementById("apartamento").value = datos.apartamento;
      document.getElementById("empleado").disabled = true;
      document.getElementById("apartamento").disabled = true;

      btnEntrada.disabled = true;
      btnSalida.disabled = false;
      banner.style.display = "block";
    } else {
      document.getElementById("empleado").disabled = false;
      document.getElementById("apartamento").disabled = false;
      btnEntrada.disabled = false;
      btnSalida.disabled = true;
      banner.style.display = "none";
    }
  }

  function mostrarEstado(mensaje, tipo) {
    const statusDiv = document.getElementById("status");
    statusDiv.className = "";
    statusDiv.classList.add("status-" + tipo);
    statusDiv.innerText = mensaje;
    statusDiv.style.display = "block";
  }

  function fichar(accion) {
    const empleado = document.getElementById("empleado").value;
    const apartamento = document.getElementById("apartamento").value;

    if (!empleado || !apartamento) {
      mostrarEstado("Por favor, selecciona tu nombre y el apartamento.", "error");
      return;
    }

    mostrarEstado("Obteniendo ubicación GPS...", "loading");

    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        (position) => {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;
          enviarDatos(empleado, apartamento, accion, lat, lng);
        },
        (error) => {
          mostrarEstado("Error GPS: Activa la ubicación de tu teléfono para fichar.", "error");
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    } else {
      mostrarEstado("Tu navegador no soporta la geolocalización.", "error");
    }
  }

  function enviarDatos(empleado, apartamento, accion, lat, lng) {
    mostrarEstado("Guardando fichaje...", "loading");

    const payload = {
      empleado: empleado,
      apartamento: apartamento,
      accion: accion,
      lat: lat,
      lng: lng
    };

    fetch(WEB_APP_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    })
    .then(() => {
      if (accion === "Entrada") {
        localStorage.setItem("fichaje_activo", JSON.stringify({ empleado, apartamento }));
        mostrarEstado("¡Entrada registrada con éxito!", "success");
      } else {
        localStorage.removeItem("fichaje_activo");
        mostrarEstado("¡Salida registrada con éxito!", "success");
      }
      setTimeout(comprobarEstadoSesion, 1500);
    })
    .catch((err) => {
      mostrarEstado("Error al guardar el fichaje. Revisa tu conexión.", "error");
    });
  }
</script>

</body>
</html>
